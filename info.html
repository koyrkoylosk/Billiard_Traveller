<meta property="og:description" content="Προκήρυξη τουρνουά μπιλιάρδου">

<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f7fa; --border:#d7dee8;
  --text:#1a2432; --muted:#5a6778; --heading:#0f2a44;
  --header:#0f2a44; --gold:#c9a227; --accent:#1f5fa8;
  --live:#1e9e5a; --live-soft:#e6f4ec; --soon:#1f5fa8; --soon-soft:#e3edf9; --done:#6b7280; --done-soft:#eef0f3; --red:#c0392b; --red-soft:#fdecea;
  --fb:#1877f2; --viber:#7360f2; --wa:#25d366;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b222c; --border:#2b3440;
    --text:#e8edf3; --muted:#a3b0bf; --heading:#ffffff;
    --header:#010409; --gold:#e3b341; --accent:#58a6ff;
    --live:#3fb950; --live-soft:#0f2e1c; --soon:#58a6ff; --soon-soft:#132a45; --done:#9aa4b2; --done-soft:#1f2630; --red:#ff7b72; --red-soft:#3a1717;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:var(--accent)}
header{background:var(--header);border-bottom:3px solid var(--gold);color:#fff}
.hwrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand .ball{font-size:26px}
.brand b{font-size:19px;display:block}
.brand small{opacity:.8;font-size:12.5px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08);cursor:pointer;font-family:inherit}
.hbtn:hover{border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.msg{padding:30px 16px;text-align:center;color:var(--muted);font-size:16px}
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.poster{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:zoom-in;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.poster img{display:block;width:100%;height:auto}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.3px;text-transform:uppercase}
.b-live{background:var(--live-soft);color:var(--live)}
.b-soon{background:var(--soon-soft);color:var(--soon)}
.b-done{background:var(--done-soft);color:var(--done)}
.b-red{background:var(--red-soft);color:var(--red)}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px);color:var(--heading);line-height:1.2}
.org{color:var(--muted);font-weight:600;margin-bottom:14px}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;min-width:0}
.fact .k{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fact .v{font-size:16px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.fact .v small{display:block;font-weight:500;font-size:13.5px;color:var(--muted)}
.fact.wide{grid-column:1 / -1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--live)}
.bar i.full{background:var(--red)}
.cta{margin-top:16px;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 18px;border-radius:11px;font-weight:800;font-size:15.5px;text-decoration:none;border:1px solid var(--border);color:var(--text);background:var(--surface-2);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.main{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.off{opacity:.55;cursor:not-allowed}
.btn.live{background:var(--live);border-color:var(--live);color:#fff}
.cta small{color:var(--muted);font-size:13.5px}
section.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:18px}
section.box h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--heading);padding-left:10px;border-left:4px solid var(--gold)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.map{width:100%;height:280px;border:0;border-radius:10px;margin-top:10px;background:var(--surface-2)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;margin:0;padding:0;list-style:none;counter-reset:p}
.players li{counter-increment:p;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players li::before{content:counter(p)". ";color:var(--muted);font-weight:500}
.share{display:flex;gap:8px;flex-wrap:wrap}
.share .btn{min-height:42px;font-size:14.5px;padding:8px 14px}
.share .fb{background:var(--fb);border-color:var(--fb);color:#fff}
.share .vb{background:var(--viber);border-color:var(--viber);color:#fff}
.share .wa{background:var(--wa);border-color:var(--wa);color:#08321a}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.mbox{background:var(--surface);color:var(--text);border-radius:14px;padding:18px;max-width:94vw;max-height:92vh;overflow:auto;text-align:center}
.mbox img{max-width:100%;max-height:80vh}
.qrb{display:inline-block;background:#fff;padding:10px;border-radius:10px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f2a44;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;display:none}
/* ---- εκτύπωση αφίσας Α4 ---- */
#printSheet{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  header,main,footer,.modal,.toast{display:none !important}
  #printSheet{display:block;font-family:Arial,sans-serif;color:#000}
  #printSheet .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c9a227;padding-bottom:6px;margin-bottom:10px}
  #printSheet h1{color:#000;font-size:26px;margin:6px 0}
  #printSheet .pimg{text-align:center}
  #printSheet .pimg img{max-width:100%;max-height:120mm}
  #printSheet table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  #printSheet td{border:1px solid #bbb;padding:5px 8px;vertical-align:top}
  #printSheet td.k{width:32%;font-weight:700;background:#f3f3f3}
  #printSheet .pq{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:14px}
}
</style>

<body>

    <a class="brand" href="index.html"><span class="ball">🎱</span><span><b>Billiard Traveller</b><small data-t="sub">Τουρνουά μπιλιάρδου</small></span></a>
    <div class="hbtns">
      <a class="hbtn" href="index.html" data-t="all">🏆 Όλα τα τουρνουά</a>

<main>
  <div id="status" class="msg" data-t="loading">Φόρτωση…</div>
  <div id="page" style="display:none">

      <div class="poster" id="poster"><span data-t="noPoster">Χωρίς αφίσα</span></div>

        <button class="btn" id="shCopy" type="button" data-t="copy">🔗 Αντιγραφή συνδέσμου</button>
        <button class="btn" id="shQr" type="button" data-t="qr">🔳 QR</button>
        <button class="btn" id="shPrint" type="button" data-t="print">🖨 Εκτύπωση αφίσας</button>

</main>
<footer>Billiard Traveller · <a href="https://www.facebook.com/billiardtravellers/" target="_blank" rel="noopener" style="color:inherit">facebook.com/billiardtravellers</a></footer>

<div id="qrModal" class="modal hidden"><div class="mbox"><b id="qrTitle"></b><div class="qrb" id="qrBox"></div><div><small id="qrUrl"></small></div><div style="margin-top:10px"><button class="btn" id="qrClose" type="button" data-t="close">Κλείσιμο</button></div></div></div>

<script>
(function(){
  const FB_CONFIG = {
    apiKey: "AIzaSyAJmOe7Woh92qMCDTy0HtepvJJDcrFgSfE",
    authDomain: "billiard-traveller.firebaseapp.com",
    projectId: "billiard-traveller",
    storageBucket: "billiard-traveller.firebasestorage.app",
    messagingSenderId: "481554679650",
    appId: "1:481554679650:web:d9d13e5d21ca89b11ace3b"
  };
  const $ = s => document.querySelector(s);
  const TID = new URLSearchParams(location.search).get('t') || '';
  let LANG = 'el';
  try{ const q = new URLSearchParams(location.search).get('lang'); LANG = q==='en'||q==='el' ? q : (localStorage.getItem('bt_tour_lang') || 'el'); }catch(e){}
  if(LANG!=='en') LANG = 'el';
  const TX = {
    el:{sub:'Τουρνουά μπιλιάρδου', all:'🏆 Όλα τα τουρνουά', loading:'Φόρτωση…', noPoster:'Χωρίς αφίσα', prizes:'🏆 Έπαθλα', rules:'📋 Κανόνες / σύστημα', place:'📍 Πού γίνεται',
      share:'📤 Κοινοποίηση', copy:'🔗 Αντιγραφή συνδέσμου', qr:'🔳 QR', print:'🖨 Εκτύπωση αφίσας', cal:'📅 Στο ημερολόγιο', close:'Κλείσιμο',
      notFound:'⚠ Το τουρνουά δεν βρέθηκε.', noId:'⚠ Λείπει ο κωδικός του τουρνουά από τον σύνδεσμο.', net:'⚠ Δεν ήταν δυνατή η σύνδεση. Έλεγξε το internet και ανανέωσε τη σελίδα.',
      deleted:'🗑 Το τουρνουά δεν είναι πια διαθέσιμο.', live:'Σε εξέλιξη', soon:'Προσεχώς', done:'Ολοκληρώθηκε', regOpen:'Δηλώσεις ανοιχτές', regClosed:'Οι δηλώσεις έκλεισαν', full:'Πλήρες',
      game:'Παιχνίδι', dates:'Ημερομηνίες', hours:'Ώρες', venue:'Μαγαζί', fee:'Συμμετοχή', spots:'Θέσεις', deadline:'Προθεσμία δηλώσεων', contact:'Επικοινωνία',
      left:'απομένουν {0}', ofMax:'{0} από {1}', noneLeft:'δεν υπάρχουν ελεύθερες θέσεις', free:'Δωρεάν', inDays:'σε {0} μέρες', inHours:'σε {0} ώρες', today:'σήμερα', ended:'έληξε',
      regBtn:'✍ Δήλωση συμμετοχής', regSoon:'Η online δήλωση ανοίγει σύντομα. Για συμμετοχή καλέστε το μαγαζί:', call:'📞 Κλήση', results:'📊 Κλήρωση & αποτελέσματα', liveBtn:'🟢 Ζωντανά αποτελέσματα',
      champ:'🏆 Νικητής: {0}', players:'👥 Δηλωμένοι παίκτες ({0})', teams:'👥 Ομάδες', copied:'✔ Ο σύνδεσμος αντιγράφηκε', directions:'🧭 Οδηγίες στον χάρτη', org:'🎱 Διοργάνωση: {0}',
      carom:'Γαλλικό', pool:'Αμερικάνικο', mosc:'Mosconi (ομάδες)', groups:'Όμιλοι (3-4)', dbl:'Διπλή πυραμίδα', ko:'νοκ-άουτ {0}', days:['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'],
      printQr:'Σκανάρετε για όλες τις πληροφορίες και τα ζωντανά αποτελέσματα'},
    en:{sub:'Billiard tournaments', all:'🏆 All tournaments', loading:'Loading…', noPoster:'No poster', prizes:'🏆 Prizes', rules:'📋 Rules / format', place:'📍 Venue',
      share:'📤 Share', copy:'🔗 Copy link', qr:'🔳 QR', print:'🖨 Print poster', cal:'📅 Add to calendar', close:'Close',
      notFound:'⚠ Tournament not found.', noId:'⚠ The tournament code is missing from the link.', net:'⚠ Could not connect. Check the internet and reload the page.',
      deleted:'🗑 This tournament is no longer available.', live:'In progress', soon:'Upcoming', done:'Finished', regOpen:'Registration open', regClosed:'Registration closed', full:'Full',
      game:'Game', dates:'Dates', hours:'Hours', venue:'Venue', fee:'Entry fee', spots:'Places', deadline:'Registration deadline', contact:'Contact',
      left:'{0} left', ofMax:'{0} of {1}', noneLeft:'no places left', free:'Free', inDays:'in {0} days', inHours:'in {0} hours', today:'today', ended:'closed',
      regBtn:'✍ Register', regSoon:'Online registration opens soon. To take part, call the venue:', call:'📞 Call', results:'📊 Draw & results', liveBtn:'🟢 Live results',
      champ:'🏆 Winner: {0}', players:'👥 Registered players ({0})', teams:'👥 Teams', copied:'✔ Link copied', directions:'🧭 Directions', org:'🎱 Organiser: {0}',
      carom:'Carom (French)', pool:'Pool (American)', mosc:'Mosconi (teams)', groups:'Groups (3-4)', dbl:'Double elimination', ko:'knockout {0}', days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
      printQr:'Scan for all the information and live results'}
  };
  const t = (k,...a)=>{ let v = (TX[LANG]||TX.el)[k]; if(v==null) v = TX.el[k]; if(typeof v!=='string') return v; a.forEach((x,i)=>{ v = v.replace('{'+i+'}', x); }); return v; };
  const esc = x => String(x==null?'':x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let DOC = null, POSTER = '';

  function appLink(d){
    return 'app.html?t='+encodeURIComponent(TID)+(d.format==='mosconi'?'&f=mosc':d.format==='groups'?'&f=grp&k='+(d.koSize||16):d.format==='carom'?'&f=car&s='+(d.size||32)+'&k='+(d.koSize||16):'&s='+(d.size||32)+(d.koSize?'&k='+d.koSize:''));
  }
  function dateRange(start, days){
    if(!start) return '';
    const [y,m,d] = start.split('-').map(Number); if(!y) return '';
    const D = t('days'), a = new Date(y,m-1,d), b = new Date(y,m-1,d+Math.max(1,days||1)-1);
    const f = x => D[x.getDay()]+' '+x.getDate()+'/'+(x.getMonth()+1);
    return (days||1)>1 ? f(a)+' – '+f(b)+' '+b.getFullYear() : f(a)+' '+a.getFullYear();
  }
  function gameLabel(d){
    if(d.format==='mosconi') return '🎱 '+t('pool')+' · '+t('mosc');
    const base = d.game==='pool' ? '🎱 '+t('pool')+(d.ball?' '+d.ball+'-ball':'') : '🎯 '+t('carom');
    const fmt = d.format==='groups' ? t('groups') : t('dbl');
    return base+' · '+fmt+(d.koSize?' · '+t('ko', d.koSize):'');
  }
  function deadlineInfo(p){
    if(!p.deadline) return {txt:'', past:false};
    const dl = new Date(p.deadline); if(isNaN(dl)) return {txt:p.deadline, past:false};
    const ms = dl - Date.now(), D = t('days');
    const base = D[dl.getDay()]+' '+dl.getDate()+'/'+(dl.getMonth()+1)+' '+String(dl.getHours()).padStart(2,'0')+':'+String(dl.getMinutes()).padStart(2,'0');
    let rel = ms<=0 ? t('ended') : ms<24*3600e3 ? (ms<3600e3 ? t('today') : t('inHours', Math.ceil(ms/3600e3))) : t('inDays', Math.ceil(ms/86400e3));
    return {txt:base, rel, past:ms<=0};
  }
  function playersOf(d){
    let st = null; try{ st = JSON.parse(d.state||'null'); }catch(e){}
    if(!st) return {list:[], teams:null};
    if(d.format==='mosconi' && st.mos){
      const tm = (st.mos.teams||[]).map((x,i)=>({name:String((x&&x.name)||'').trim()||(LANG==='en'?(i?'TEAM B':'TEAM A'):(i?'ΟΜΑΔΑ Β':'ΟΜΑΔΑ Α')), pl:((x&&x.p)||[]).map(p=>String(p||'').trim()).filter(Boolean)}));
      return {list:[], teams:tm};
    }
    const seen = {}, out = [];
    (st.participants||[]).forEach(n=>{ n = String(n||'').trim(); if(!n || n.toUpperCase()==='BYE' || /^player\s*\d+$/i.test(n)) return; const k = n.toLocaleLowerCase('el'); if(seen[k]) return; seen[k]=1; out.push(n); });
    return {list:out, teams:null};
  }
  function fact(k, v, wide){ return '<div class="fact'+(wide?' wide':'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }

  function render(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent = t(e.dataset.t); });
    $('#langBtn').textContent = LANG==='el' ? 'EN' : 'ΕΛ';
    const d = DOC; if(!d) return;
    const p = d.promo && d.promo.on ? d.promo : {};
    const title = d.title || TID;
    document.title = title+' — Billiard Traveller';
    $('#title').textContent = title;
    $('#org').textContent = d.organizer ? t('org', d.organizer) : '';
    const pl = playersOf(d), count = pl.teams ? 0 : (pl.list.length || +d.entries || 0);
    const max = parseInt(p.max,10)||0, left = max ? Math.max(0, max-count) : 0;
    const dl = deadlineInfo(p);
    const status = d.champion ? 'finished' : (d.status||'upcoming');
    const regOpen = status==='upcoming' && !dl.past && (!max || left>0);
    // σήματα
    let b = status==='live' ? '<span class="badge b-live">● '+esc(t('live'))+'</span>' : status==='finished' ? '<span class="badge b-done">'+esc(t('done'))+'</span>' : '<span class="badge b-soon">📅 '+esc(t('soon'))+'</span>';
    if(status==='upcoming' && d.promo && d.promo.on) b += max && !left ? '<span class="badge b-red">'+esc(t('full'))+'</span>' : regOpen ? '<span class="badge b-live">'+esc(t('regOpen'))+'</span>' : '<span class="badge b-red">'+esc(t('regClosed'))+'</span>';
    $('#badges').innerHTML = b;
    // στοιχεία
    const loc = [p.venue, p.addr, p.city].filter(Boolean);
    let f = fact(t('game'), esc(gameLabel(d)), true)
      + fact(t('dates'), esc(dateRange(d.startDate, d.days)))
      + (p.hours ? fact(t('hours'), esc(p.hours)) : '')
      + (loc.length ? fact(t('venue'), esc(p.venue||'')+'<small>'+esc([p.addr,p.city].filter(Boolean).join(', '))+'</small>') : '')
      + (d.promo && d.promo.on ? fact(t('fee'), (+p.fee ? esc(String(+p.fee).replace('.',',')+' €') : esc(t('free')))) : '');
    if(max) f += fact(t('spots'), esc(t('ofMax', count, max))+'<small>'+esc(left ? t('left', left) : t('noneLeft'))+'</small><div class="bar"><i class="'+(left?'':'full')+'" style="width:'+Math.min(100, Math.round(count/max*100))+'%"></i></div>');
    if(dl.txt) f += fact(t('deadline'), esc(dl.txt)+'<small>'+esc(dl.rel||'')+'</small>');
    if(p.phone) f += fact(t('contact'), '<a href="tel:'+esc(String(p.phone).replace(/[^\d+]/g,''))+'">'+esc(p.phone)+'</a>');
    $('#facts').innerHTML = f;
    // κουμπιά
    let c = '';
    if(d.champion) c += '<div style="font-weight:800;font-size:17px">'+esc(t('champ', d.champion))+'</div>';
    if(status==='upcoming' && d.promo && d.promo.on){
      c += '<div class="row"><button class="btn main off" type="button" disabled>'+esc(t('regBtn'))+'</button>'+(p.phone?'<a class="btn" href="tel:'+esc(String(p.phone).replace(/[^\d+]/g,''))+'">'+esc(t('call'))+' '+esc(p.phone)+'</a>':'')+'</div>';
      c += '<small>'+esc(t('regSoon'))+' '+esc(p.phone||'')+'</small>';
    }
    c += '<div class="row"><a class="btn '+(status==='live'?'live':'')+'" href="'+esc(appLink(d))+'">'+esc(status==='live' ? t('liveBtn') : t('results'))+'</a></div>';
    $('#cta').innerHTML = c;
    // κείμενα
    $('#prizes').textContent = p.prizes || ''; $('#sPrizes').style.display = p.prizes ? '' : 'none';
    $('#rules').textContent = p.rules || ''; $('#sRules').style.display = p.rules ? '' : 'none';
    if(loc.length){
      const q = encodeURIComponent(loc.join(', '));
      $('#place').innerHTML = '<b>'+esc(p.venue||'')+'</b><br>'+esc([p.addr,p.city].filter(Boolean).join(', '))+'<br><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">'+esc(t('directions'))+'</a>';
      const mp = $('#map'), src = 'https://maps.google.com/maps?q='+q+'&z=16&output=embed';
      if(mp.dataset.src!==src){ mp.dataset.src = src; mp.src = src; }
      $('#sPlace').style.display = '';
    } else $('#sPlace').style.display = 'none';
    // παίκτες
    if(pl.teams){
      $('#hPlayers').textContent = t('teams');
      $('#players').innerHTML = pl.teams.map(x=>'<li style="white-space:normal"><b>'+esc(x.name)+'</b>: '+esc(x.pl.join(', '))+'</li>').join('');
      $('#sPlayers').style.display = '';
    } else {
      $('#hPlayers').textContent = t('players', pl.list.length);
      $('#players').innerHTML = pl.list.map(n=>'<li title="'+esc(n)+'">'+esc(n)+'</li>').join('');
      $('#sPlayers').style.display = pl.list.length ? '' : 'none';
    }
    // κοινοποίηση
    const url = location.href.split('#')[0].replace(/[?&]lang=(el|en)/,'');
    const msg = title+' — '+dateRange(d.startDate, d.days)+(p.city?' · '+p.city:'');
    $('#shFb').href = 'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);
    $('#shVb').href = 'viber://forward?text='+encodeURIComponent(msg+' '+url);
    $('#shWa').href = 'https://wa.me/?text='+encodeURIComponent(msg+' '+url);
    $('#shCal').style.display = d.startDate ? '' : 'none';
    buildPrint(d, p, url);
    $('#status').style.display = 'none'; $('#page').style.display = '';
  }
  function drawQR(el, text, size){
    el.innerHTML='';
    try{ if(typeof QRCode!=='undefined'){ new QRCode(el,{text,width:size||220,height:size||220}); return; } }catch(e){}
    const img=document.createElement('img'); img.width=size||220; img.height=size||220; img.alt='QR';
    img.src='https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&data='+encodeURIComponent(text);
    el.appendChild(img);
  }
  function buildPrint(d, p, url){
    const ps = $('#printSheet');
    const rows = [[t('game'), gameLabel(d)], [t('dates'), dateRange(d.startDate, d.days)], [t('hours'), p.hours], [t('venue'), [p.venue,p.addr,p.city].filter(Boolean).join(', ')],
      [t('fee'), d.promo && d.promo.on ? (+p.fee ? String(+p.fee).replace('.',',')+' €' : t('free')) : ''], [t('spots'), p.max], [t('deadline'), deadlineInfo(p).txt], [t('contact'), p.phone], [t('prizes').replace(/^\S+\s/,''), p.prizes]]
      .filter(r=>r[1]);
    ps.innerHTML = '<div class="ph"><b>🎱 Billiard Traveller</b><span>'+esc(d.organizer||'')+'</span></div><h1>'+esc(d.title||TID)+'</h1>'
      + (POSTER ? '<div class="pimg"><img src="'+POSTER+'" alt=""></div>' : '')
      + '<table>'+rows.map(r=>'<tr><td class="k">'+esc(r[0])+'</td><td style="white-space:pre-wrap">'+esc(r[1])+'</td></tr>').join('')+'</table>'
      + '<div class="pq"><div id="pqr"></div><div>'+esc(t('printQr'))+'<br><small>'+esc(url)+'</small></div></div>';
    drawQR(ps.querySelector('#pqr'), url, 120);
  }
  function icsDownload(){
    const d = DOC, p = (d.promo && d.promo.on) ? d.promo : {}; if(!d || !d.startDate) return;
    const [y,m,dd] = d.startDate.split('-').map(Number), e = new Date(y, m-1, dd + Math.max(1, d.days||1));
    const fmt = x => x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');
    const escI = x => String(x||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Billiard Traveller//Tournament//EL','BEGIN:VEVENT','UID:'+TID+'@billiard-traveller',
      'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),'DTSTART;VALUE=DATE:'+d.startDate.replace(/-/g,''),'DTEND;VALUE=DATE:'+fmt(e),
      'SUMMARY:'+escI(d.title||TID),'LOCATION:'+escI([p.venue,p.addr,p.city].filter(Boolean).join(', ')),'DESCRIPTION:'+escI((p.hours?p.hours+'\n':'')+location.href),'URL:'+location.href,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download = (TID||'tournament')+'.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function toast(m){ const e=$('#toast'); e.textContent=m; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none', 2200); }
  function wire(){
    $('#langBtn').addEventListener('click', ()=>{ LANG = LANG==='el' ? 'en' : 'el'; try{ localStorage.setItem('bt_tour_lang', LANG); }catch(e){} render(); if(!DOC) document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent = t(e.dataset.t); }); });
    $('#poster').addEventListener('click', ()=>{ if(!POSTER) return; $('#imgBig').src = POSTER; $('#imgModal').classList.remove('hidden'); });
    $('#imgModal').addEventListener('click', ()=>$('#imgModal').classList.add('hidden'));
    $('#shCopy').addEventListener('click', async ()=>{ const u = location.href.split('#')[0]; try{ await navigator.clipboard.writeText(u); }catch(e){ const ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); } toast(t('copied')); });
    $('#shQr').addEventListener('click', ()=>{ const u = location.href.split('#')[0]; $('#qrTitle').textContent = (DOC&&DOC.title)||TID; drawQR($('#qrBox'), u); $('#qrUrl').textContent = u; $('#qrModal').classList.remove('hidden'); });
    $('#qrClose').addEventListener('click', ()=>$('#qrModal').classList.add('hidden'));
    $('#shPrint').addEventListener('click', ()=>window.print());
    $('#shCal').addEventListener('click', icsDownload);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden')); });
  }
  function start(){
    wire();
    document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent = t(e.dataset.t); });
    $('#langBtn').textContent = LANG==='el' ? 'EN' : 'ΕΛ';
    if(!TID){ $('#status').textContent = t('noId'); return; }
    if(typeof firebase==='undefined'){ $('#status').textContent = t('net'); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      const ref = firebase.firestore().collection('tournaments').doc(TID);
      ref.onSnapshot(ds=>{
        if(!ds.exists){ DOC = null; $('#page').style.display='none'; $('#status').style.display=''; $('#status').textContent = t('notFound'); return; }
        const d = ds.data();
        if(d.deleted){ DOC = null; $('#page').style.display='none'; $('#status').style.display=''; $('#status').textContent = t('deleted'); return; }
        const pa = d.promo && d.promo.posterAt, old = DOC && DOC.promo && DOC.promo.posterAt;
        DOC = d; render();
        if(pa && pa!==old){ ref.collection('pub').doc('poster').get().then(ps=>{ const x = ps.exists ? ps.data() : null; POSTER = (x && x.img) || '';
          $('#poster').innerHTML = POSTER ? '<img alt="">' : '<span>'+esc(t('noPoster'))+'</span>'; if(POSTER) $('#poster img').src = POSTER; buildPrint(DOC, (DOC.promo&&DOC.promo.on)?DOC.promo:{}, location.href.split('#')[0]); }).catch(()=>{}); }
      }, err=>{ $('#status').textContent = t('net')+' ('+(err.code||'')+')'; });
    }catch(e){ $('#status').textContent = t('net'); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
