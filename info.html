<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f7fa; --border:#d7dee8;
  --text:#1a2432; --muted:#5a6778; --heading:#0f2a44;
  --header:#0f2a44; --gold:#c9a227; --accent:#1f5fa8;
  --live:#1e9e5a; --live-soft:#e6f4ec; --soon:#1f5fa8; --soon-soft:#e3edf9; --done:#6b7280; --done-soft:#eef0f3; --red:#c0392b; --red-soft:#fdecea;
  --fb:#1877f2; --viber:#7360f2; --wa:#25d366;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b222c; --border:#2b3440;
    --text:#e8edf3; --muted:#a3b0bf; --heading:#ffffff;
    --header:#010409; --gold:#e3b341; --accent:#58a6ff;
    --live:#3fb950; --live-soft:#0f2e1c; --soon:#58a6ff; --soon-soft:#132a45; --done:#9aa4b2; --done-soft:#1f2630; --red:#ff7b72; --red-soft:#3a1717;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:var(--accent)}
header{background:var(--header);border-bottom:3px solid var(--gold);color:#fff}
.hwrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand .ball{font-size:26px}
.brand b{font-size:19px;display:block}
.brand small{opacity:.8;font-size:12.5px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08);cursor:pointer;font-family:inherit}
.hbtn:hover{border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.msg{padding:30px 16px;text-align:center;color:var(--muted);font-size:16px}
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.poster{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:zoom-in;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.poster img{display:block;width:100%;height:auto}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.3px;text-transform:uppercase}
.b-live{background:var(--live-soft);color:var(--live)}
.b-soon{background:var(--soon-soft);color:var(--soon)}
.b-done{background:var(--done-soft);color:var(--done)}
.b-red{background:var(--red-soft);color:var(--red)}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px);color:var(--heading);line-height:1.2}
.org{color:var(--muted);font-weight:600;margin-bottom:14px}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;min-width:0}
.fact .k{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fact .v{font-size:16px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.fact .v small{display:block;font-weight:500;font-size:13.5px;color:var(--muted)}
.fact.wide{grid-column:1 / -1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--live)}
.bar i.full{background:var(--red)}
.cta{margin-top:16px;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 18px;border-radius:11px;font-weight:800;font-size:15.5px;text-decoration:none;border:1px solid var(--border);color:var(--text);background:var(--surface-2);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.main{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.off{opacity:.55;cursor:not-allowed}
.btn.live{background:var(--live);border-color:var(--live);color:#fff}
.cta small{color:var(--muted);font-size:13.5px}
section.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:18px}
section.box h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--heading);padding-left:10px;border-left:4px solid var(--gold)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.map{width:100%;height:280px;border:0;border-radius:10px;margin-top:10px;background:var(--surface-2)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;margin:0;padding:0;list-style:none;counter-reset:p}
.players li{counter-increment:p;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players li::before{content:counter(p)". ";color:var(--muted);font-weight:500}
.share{display:flex;gap:8px;flex-wrap:wrap}
.share .btn{min-height:42px;font-size:14.5px;padding:8px 14px}
.share .fb{background:var(--fb);border-color:var(--fb);color:#fff}
.share .vb{background:var(--viber);border-color:var(--viber);color:#fff}
.share .wa{background:var(--wa);border-color:var(--wa);color:#08321a}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.mbox{background:var(--surface);color:var(--text);border-radius:14px;padding:18px;max-width:94vw;max-height:92vh;overflow:auto;text-align:center}
.mbox img{max-width:100%;max-height:80vh}
.qrb{display:inline-block;background:#fff;padding:10px;border-radius:10px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f2a44;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;display:none}
/* ---- εκτύπωση αφίσας Α4 ---- */
#printSheet{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  header,main,footer,.modal,.toast{display:none !important}
  #printSheet{display:block;font-family:Arial,sans-serif;color:#000}
  #printSheet .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c9a227;padding-bottom:6px;margin-bottom:10px}
  #printSheet h1{color:#000;font-size:26px;margin:6px 0}
  #printSheet .pimg{text-align:center}
  #printSheet .pimg img{max-width:100%;max-height:120mm}
  #printSheet table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  #printSheet td{border:1px solid #bbb;padding:5px 8px;vertical-align:top}
  #printSheet td.k{width:32%;font-weight:700;background:#f3f3f3}
  #printSheet .pq{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:14px}
}
</style>

        <button class="btn" id="shPrint" type="button" data-t="print">🖨 Εκτύπωση αφίσας</button>
        <button class="btn" id="shCal" type="button" data-t="cal">📅 Στο ημερολόγιο</button>
      </div>
    </section>
  </div>
</main>
